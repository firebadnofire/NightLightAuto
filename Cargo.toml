[package]
name = "fullscreen-night-light"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
description = "Native Windows fullscreen-aware Night Light manager"
build = "build.rs"

[[bin]]
name = "FullscreenNightLight"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
win-nightlight-lib = "=0.5.0"
win-nightlight-watch = "=0.5.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Time", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
